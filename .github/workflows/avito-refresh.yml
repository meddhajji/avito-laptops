name: Daily Avito Data Refresh

on:
  schedule:
    # Off the top of the hour, when GitHub's scheduler is busiest
    - cron: '23 1 * * *'   # 01:23 UTC, around 2:23 AM in Morocco

  # Allows triggering the workflow manually from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages to scrape (leave empty for the whole category)"
        required: false
        type: string

# Never run two refreshes at once; a second trigger waits for the first to finish
concurrency:
  group: avito-refresh
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Caches dependencies to speed up future runs
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipelines/avito/requirements.txt
          
      - name: Run data pipeline
        working-directory: ./pipelines/avito
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGES: ${{ inputs.pages }}
        run: |
          python pipeline.py ${PAGES:+--pages "$PAGES"}
