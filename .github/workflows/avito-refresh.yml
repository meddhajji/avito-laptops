name: Daily Avito Data Refresh

on:
  # GitHub's schedule trigger. It has never fired for this repository (a no-op
  # workflow scheduled every five minutes was not run once in nine hours; see
  # github.com/orgs/community/discussions/206019). It stays here so runs resume
  # on their own if GitHub fixes it.
  schedule:
    - cron: '23 1 * * *'   # 01:23 UTC, around 2:23 AM in Morocco

  # What actually starts the nightly run: Vercel Cron calls the site's
  # /api/cron/refresh route, which dispatches this workflow. Also used for
  # manual runs from the Actions tab.
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages to scrape (leave empty for the whole category)"
        required: false
        type: string

# Never run two refreshes at once; a second trigger waits for the first to finish
concurrency:
  group: avito-refresh
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Caches dependencies to speed up future runs
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          
      - name: Run data pipeline
        working-directory: ./pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGES: ${{ inputs.pages }}
        run: |
          python pipeline.py ${PAGES:+--pages "$PAGES"}
